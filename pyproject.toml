[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "elench"
version = "1.0.0"
description = "Elench: a cost-contract language and static verification framework for AI-generated code"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Wang, Haolin" }]
keywords = ["cost analysis", "static analysis", "complexity", "AI-generated code"]

# **零第三方依赖**是本项目的一条承诺（见 README）：这里保持空列表，
# 任何新增依赖都必须先改 README 的承诺，再改这里。
dependencies = []

[project.urls]
Homepage = "https://github.com/xiaohuo123212/ai-lang-design"

# `src/` 在仓库里是扁平目录（历史上就这样），因此：
#   · 顶层模块用 `py-modules` 逐个列出（扁平文件不会被 setuptools 自动发现）
#   · `cost_domain/` 是真包，用 `packages` 列出
#
# **必须列全**：`dsh` 会 import 下面每一个模块，漏一个 `elench` 就跑不起来。
# 2026-11-03 补齐：chart / cost_diff / cxx_map / emit / ffi_c / fmt / grammar /
# guarantees / jsonval / kinds / otel_export / policy / requires / segment_plan /
# shape / stdlib 与 `cost_domain` 包此前都漏在清单外——装出来的包一跑就
# ImportError，而 `pip install` 本身不报错。
[tool.setuptools]
py-modules = [
    "ast_util",
    "bench",
    "borrow",
    "bound",
    "cfg",
    "chart",
    "check_docs",
    "checker",
    "cost_check",
    "contract_metric",
    "cost_diff",
    "cost_explain",
    "cost_interp",
    "cxx_map",
    "dispatch",
    "dsh",
    "dup_scan",
    "elench",
    "emit",
    "ffi_c",
    "fmt",
    "formatter",
    "grammar",
    "guarantees",
    "highlight",
    "interp",
    "isolated",
    "jsonval",
    "kappa_vs_measured",
    "kinds",
    "lexer",
    "migrate_docs",
    "otel",
    "otel_dashboard",
    "otel_local_sink",
    "otel_view",
    "otel_export",
    "parser",
    "policy",
    "rename_ch",
    "requires",
    "segment_plan",
    "shape",
    "stdlib",
    "symbolic",
    "sync_docs",
    "typecheck",
    "walk",
]
packages = ["cost_domain"]
package-dir = { "" = "src" }

[project.scripts]
"elench" = "elench:main"
